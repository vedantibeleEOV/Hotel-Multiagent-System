<style>/* ============================================================
   COLORS — Airbnb design system
   Single brand voltage (Rausch #ff385c) on a pure-white canvas.
   ============================================================ */
:root {
  /* --- Brand / Accent --- */
  --color-primary: #ff385c;          /* Rausch — the one brand color */
  --color-primary-active: #e00b41;   /* press / pointer-down */
  --color-primary-disabled: #ffd1da; /* pale CTA tint */
  --color-luxe: #460479;             /* Airbnb Luxe sub-brand only */
  --color-plus: #92174d;             /* Airbnb Plus sub-brand only */

  /* --- Ink / Text --- */
  --color-ink: #222222;        /* headlines, body, nav — never pure black */
  --color-body: #3f3f3f;       /* long-form running text */
  --color-muted: #6a6a6a;      /* sub-titles, inactive tabs, "View all" */
  --color-muted-soft: #929292; /* disabled link text */
  --color-on-primary: #ffffff; /* text on Rausch */
  --color-on-dark: #ffffff;

  /* --- Surfaces --- */
  --color-canvas: #ffffff;        /* default page floor */
  --color-surface-soft: #f7f7f7;  /* disabled fields, hover bg */
  --color-surface-strong: #f2f2f2;/* circular icon-button surface */

  /* --- Hairlines / Borders --- */
  --color-hairline: #dddddd;        /* default 1px border */
  --color-hairline-soft: #ebebeb;   /* lighter editorial divider */
  --color-border-strong: #c1c1c1;   /* disabled outline, input outline */

  /* --- Semantic --- */
  --color-error: #c13515;        /* inline form error text */
  --color-error-hover: #b32505;
  --color-legal-link: #428bff;   /* links inside legal copy only */
  --color-star: #222222;         /* star + rating numbers render in ink */
  --color-scrim: rgba(0, 0, 0, 0.5); /* modal backdrop */

  /* ----------------------------------------------------------
     SEMANTIC ALIASES — prefer these in components
     ---------------------------------------------------------- */
  --text-primary: var(--color-ink);
  --text-secondary: var(--color-body);
  --text-muted: var(--color-muted);
  --text-on-accent: var(--color-on-primary);
  --surface-page: var(--color-canvas);
  --surface-card: var(--color-canvas);
  --surface-sunken: var(--color-surface-soft);
  --surface-control: var(--color-surface-strong);
  --border-default: var(--color-hairline);
  --border-subtle: var(--color-hairline-soft);
  --accent: var(--color-primary);
  --accent-pressed: var(--color-primary-active);
}
</style>
<style>/* ============================================================
   TYPOGRAPHY — Airbnb Cereal VF (Inter substitute)
   Modest weights; the system trusts photography over type.
   ============================================================ */
:root {
  --font-sans: 'Inter', 'Airbnb Cereal VF', Circular, -apple-system, system-ui,
    Roboto, 'Helvetica Neue', sans-serif;

  /* --- Weights --- */
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* --- Type scale (token: size / weight / line-height / tracking) ---
     Mirrors the DESIGN.md hierarchy. Use the paired custom props. */

  /* rating-display — the single loud moment (listing rating "4.81") */
  --type-rating-size: 64px;   --type-rating-weight: 700; --type-rating-lh: 1.1;  --type-rating-ls: -1px;
  /* display-xl — homepage h1 */
  --type-display-xl-size: 28px; --type-display-xl-weight: 700; --type-display-xl-lh: 1.2; --type-display-xl-ls: 0;
  /* display-lg — listing detail h1 */
  --type-display-lg-size: 22px; --type-display-lg-weight: 500; --type-display-lg-lh: 1.18; --type-display-lg-ls: -0.44px;
  /* display-md — section heads */
  --type-display-md-size: 21px; --type-display-md-weight: 700; --type-display-md-lh: 1.3; --type-display-md-ls: 0;
  /* display-sm — sub-section titles */
  --type-display-sm-size: 20px; --type-display-sm-weight: 600; --type-display-sm-lh: 1.2; --type-display-sm-ls: -0.18px;
  /* title-md — card / city titles */
  --type-title-md-size: 16px; --type-title-md-weight: 600; --type-title-md-lh: 1.25; --type-title-md-ls: 0;
  /* title-sm — footer column heads */
  --type-title-sm-size: 16px; --type-title-sm-weight: 500; --type-title-sm-lh: 1.25; --type-title-sm-ls: 0;
  /* body-md — default running text */
  --type-body-md-size: 16px; --type-body-md-weight: 400; --type-body-md-lh: 1.5; --type-body-md-ls: 0;
  /* body-sm — card meta, prices, dates */
  --type-body-sm-size: 14px; --type-body-sm-weight: 400; --type-body-sm-lh: 1.43; --type-body-sm-ls: 0;
  /* caption — search segment labels */
  --type-caption-size: 14px; --type-caption-weight: 500; --type-caption-lh: 1.29; --type-caption-ls: 0;
  /* caption-sm — legal line */
  --type-caption-sm-size: 13px; --type-caption-sm-weight: 400; --type-caption-sm-lh: 1.23; --type-caption-sm-ls: 0;
  /* badge — "Guest favorite" */
  --type-badge-size: 11px; --type-badge-weight: 600; --type-badge-lh: 1.18; --type-badge-ls: 0;
  /* uppercase-tag — "NEW" */
  --type-tag-size: 8px; --type-tag-weight: 700; --type-tag-lh: 1.25; --type-tag-ls: 0.32px;
  /* button-md / nav-link */
  --type-button-size: 16px; --type-button-weight: 500; --type-button-lh: 1.25; --type-button-ls: 0;
  --type-nav-size: 16px; --type-nav-weight: 600; --type-nav-lh: 1.25; --type-nav-ls: 0;
}
</style>
<style>/* ============================================================
   SPACING — 4px base unit with a 2px micro-step.
   ============================================================ */
:root {
  --space-xxs: 2px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-base: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-xxl: 48px;
  --space-section: 64px; /* major page bands — denser than typical SaaS */

  /* layout */
  --container-max: 1280px;  /* homepage / editorial */
  --container-listing: 1080px;
  --gutter-card: 16px;      /* property + city grid gutters */
}
</style>
<style>/* ============================================================

   ============================================================ */
:root {
  --radius-none: 0px;
  --radius-xs: 4px;
  --radius-sm: 8px;   /* buttons, inputs */
  --radius-md: 14px;  /* property / experience cards */
  --radius-lg: 20px;
  --radius-xl: 32px;  /* category strip cells */
  --radius-full: 9999px; /* search bar, orbs, hearts, pills */
}

<style>/* ============================================================
   ELEVATION — one shadow tier plus the flat baseline. Depth comes
   from photography and white-on-white separation, not layered shadows.

                  rgba(0, 0, 0, 0.04) 0 2px 6px 0,
                  rgba(0, 0, 0, 0.1) 0 4px 8px 0;
  --shadow-none: none;
}

/* ============================================================
   COLORS — Airbnb design system
   Single brand voltage (Rausch #ff385c) on a pure-white canvas.
   ============================================================ */
:root {
  /* --- Brand / Accent --- */
  --color-primary: #ff385c;          /* Rausch — the one brand color */
  --color-primary-active: #e00b41;   /* press / pointer-down */
  --color-primary-disabled: #ffd1da; /* pale CTA tint */
  --color-luxe: #460479;             /* Airbnb Luxe sub-brand only */
  --color-plus: #92174d;             /* Airbnb Plus sub-brand only */

  /* --- Ink / Text --- */
  --color-ink: #222222;        /* headlines, body, nav — never pure black */
  --color-body: #3f3f3f;       /* long-form running text */
  --color-muted: #6a6a6a;      /* sub-titles, inactive tabs, "View all" */
  --color-muted-soft: #929292; /* disabled link text */
  --color-on-primary: #ffffff; /* text on Rausch */
  --color-on-dark: #ffffff;

  /* --- Surfaces --- */
  --color-canvas: #ffffff;        /* default page floor */
  --color-surface-soft: #f7f7f7;  /* disabled fields, hover bg */
  --color-surface-strong: #f2f2f2;/* circular icon-button surface */

  /* --- Hairlines / Borders --- */
  --color-hairline: #dddddd;        /* default 1px border */
  --color-hairline-soft: #ebebeb;   /* lighter editorial divider */
  --color-border-strong: #c1c1c1;   /* disabled outline, input outline */

  /* --- Semantic --- */
  --color-error: #c13515;        /* inline form error text */
  --color-error-hover: #b32505;
  --color-legal-link: #428bff;   /* links inside legal copy only */
  --color-star: #222222;         /* star + rating numbers render in ink */
  --color-scrim: rgba(0, 0, 0, 0.5); /* modal backdrop */

  /* ----------------------------------------------------------
     SEMANTIC ALIASES — prefer these in components
     ---------------------------------------------------------- */
  --text-primary: var(--color-ink);
  --text-secondary: var(--color-body);
  --text-muted: var(--color-muted);
  --text-on-accent: var(--color-on-primary);
  --surface-page: var(--color-canvas);
  --surface-card: var(--color-canvas);
  --surface-sunken: var(--color-surface-soft);
  --surface-control: var(--color-surface-strong);
  --border-default: var(--color-hairline);
  --border-subtle: var(--color-hairline-soft);
  --accent: var(--color-primary);
  --accent-pressed: var(--color-primary-active);
}

/* ============================================================
   TYPOGRAPHY — Airbnb Cereal VF (Inter substitute)
   Modest weights; the system trusts photography over type.
   ============================================================ */
:root {
  --font-sans: 'Inter', 'Airbnb Cereal VF', Circular, -apple-system, system-ui,
    Roboto, 'Helvetica Neue', sans-serif;

  /* --- Weights --- */
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* --- Type scale (token: size / weight / line-height / tracking) ---
     Mirrors the DESIGN.md hierarchy. Use the paired custom props. */

  /* rating-display — the single loud moment (listing rating "4.81") */
  --type-rating-size: 64px;   --type-rating-weight: 700; --type-rating-lh: 1.1;  --type-rating-ls: -1px;
  /* display-xl — homepage h1 */
  --type-display-xl-size: 28px; --type-display-xl-weight: 700; --type-display-xl-lh: 1.2; --type-display-xl-ls: 0;
  /* display-lg — listing detail h1 */
  --type-display-lg-size: 22px; --type-display-lg-weight: 500; --type-display-lg-lh: 1.18; --type-display-lg-ls: -0.44px;
  /* display-md — section heads */
  --type-display-md-size: 21px; --type-display-md-weight: 700; --type-display-md-lh: 1.3; --type-display-md-ls: 0;
  /* display-sm — sub-section titles */
  --type-display-sm-size: 20px; --type-display-sm-weight: 600; --type-display-sm-lh: 1.2; --type-display-sm-ls: -0.18px;
  /* title-md — card / city titles */
  --type-title-md-size: 16px; --type-title-md-weight: 600; --type-title-md-lh: 1.25; --type-title-md-ls: 0;
  /* title-sm — footer column heads */
  --type-title-sm-size: 16px; --type-title-sm-weight: 500; --type-title-sm-lh: 1.25; --type-title-sm-ls: 0;
  /* body-md — default running text */
  --type-body-md-size: 16px; --type-body-md-weight: 400; --type-body-md-lh: 1.5; --type-body-md-ls: 0;
  /* body-sm — card meta, prices, dates */
  --type-body-sm-size: 14px; --type-body-sm-weight: 400; --type-body-sm-lh: 1.43; --type-body-sm-ls: 0;
  /* caption — search segment labels */
  --type-caption-size: 14px; --type-caption-weight: 500; --type-caption-lh: 1.29; --type-caption-ls: 0;
  /* caption-sm — legal line */
  --type-caption-sm-size: 13px; --type-caption-sm-weight: 400; --type-caption-sm-lh: 1.23; --type-caption-sm-ls: 0;
  /* badge — "Guest favorite" */
  --type-badge-size: 11px; --type-badge-weight: 600; --type-badge-lh: 1.18; --type-badge-ls: 0;
  /* uppercase-tag — "NEW" */

:root {

.fline.flowing{background:repeating-linear-gradient(180deg,#222 0 6px,transparent 6px 12px);background-size:2px 12px;animation:flowd .6s linear infinite}
@keyframes flowd{to{background-position:0 12px}}
.fcont{padding:0 0 24px;display:flex;flex-direction:column;gap:2px;min-width:0}
.flabel2{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--color-muted)}
.fnode.wait .fcont{opacity:.6}
/* reports */
.bars{display:flex;align-items:flex-end;gap:10px;position:relative;padding-top:8px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bstack{flex:1;width:100%;max-width:44px;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:2px}
.bstack i{display:block;width:100%;border-radius:4px}
.tgt{position:absolute;left:0;right:0;border-top:1.5px dashed #929292;z-index:1;margin-bottom:24px}
.tgt span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--color-muted);background:#fff;padding:0 4px}
/* mobile */
.mstage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px;background:#f2f2f2;flex-wrap:wrap}
.mside{width:340px}
.phone{width:390px;height:844px;border-radius:52px;background:#222;padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.18);flex-shrink:0}
.pscreen{width:100%;height:100%;border-radius:42px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.psb{display:flex;justify-content:space-between;padding:16px 28px 6px;font-size:14px}
.phead2{padding:8px 20px 14px;border-bottom:1px solid var(--color-hairline-soft)}
.availt{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--color-hairline);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.pbody{flex:1;overflow:auto;padding:16px 20px 24px;background:#f7f7f7}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--color-hairline);padding:8px 8px 22px;background:#fff}
.ptabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--color-muted);cursor:pointer;min-height:48px;justify-content:center}
.ptabs button.on{color:var(--color-ink)}.ptabs .badge{top:-6px;right:-10px}
.mcard{background:#fff;border:1px solid var(--color-hairline);border-radius:16px;overflow:hidden}.mcard.mcrit{border:2px solid #c13515}.mcard.mover{border-color:#c13515}
.mbtn{flex:1;min-height:48px;border-radius:10px;border:1px solid #c1c1c1;background:#fff;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.mbtn.pri{background:var(--color-primary);color:#fff;border:none}.mbtn.pri:active{background:var(--color-primary-active)}
.mcritalert{display:flex;gap:10px;align-items:center;background:#c13515;color:#fff;border:none;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
/* responsive */
@media (max-width:1360px){.kgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.kgrid.k7{grid-template-columns:repeat(4,minmax(0,1fr))}.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}.hkwrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){.app{grid-template-columns:68px minmax(0,1fr)}.side .nl,.side .brand .col,.sidefoot{display:none}.nav{justify-content:center;padding:0;position:relative}.nav .ct{position:absolute;top:2px;right:4px;margin:0}.brand{justify-content:center;padding:4px 0 20px}.g2-1,.g2{grid-template-columns:minmax(0,1fr)}.hide-md{display:none}.kgrid.k5,.kgrid.k6{grid-template-columns:repeat(3,minmax(0,1fr))}.orch{grid-template-columns:minmax(0,1fr)}.trlist{border-right:none;border-bottom:1px solid var(--color-hairline-soft);max-height:220px}.search{width:auto;flex:1}}
@media (max-width:720px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.page{padding:16px}.kgrid,.kgrid.k5,.kgrid.k6,.kgrid.k7,.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:0 12px;gap:6px}.fcells{grid-template-columns:repeat(10,minmax(0,1fr))}}
</style>
